<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      cursor: pointer;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<video id="myVideo" autoplay muted playsinline loop>
  <source src="rickroll.mp4" type="video/mp4">
</video>

<script>
  window.addEventListener("click", () => {
    const video = document.getElementById("myVideo");
    if (video) {
      video.muted = false;
      video.volume = 1.0;
      video.play();
    }
  });
</script>

</body>
</html>

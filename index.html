<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      width: 100%;
      overflow: hidden;
      cursor: pointer;
    }

    /* Container to make YouTube iframe fill full screen */
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* Prevents clicking video controls directly */
    }

    #player {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Invisible click trigger spanning the whole screen */
    #trigger {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999;
      background: transparent;
    }
  </style>
</head>
<body>

<div id="trigger"></div>

<div class="video-container">
  <div id="player"></div>
</div>

<!-- Load YouTube iFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;

  // Called automatically when YouTube API script finishes loading
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: 'dQw4w9WgXcQ',
      playerVars: {
        'autoplay': 1,
        'controls': 0,        // Hide YouTube player controls
        'disablekb': 1,        // Disable keyboard shortcuts
        'modestbranding': 1,  // Minimal YouTube branding
        'loop': 1,
        'playlist': 'dQw4w9WgXcQ', // Required for looping single video
        'playsinline': 1
      },
      events: {
        'onReady': (event) => {
          event.target.mute();
          event.target.playVideo();
        }
      }
    });
  }

  // Handle initial user click to unmute and trigger audio
  const trigger = document.getElementById("trigger");
  trigger.addEventListener("click", () => {
    if (player && typeof player.unMute === "function") {
      player.unMute();
      player.setVolume(100);
      player.playVideo();
      trigger.remove(); // Remove trigger so user interacts with video normally
    }
  });
</script>

</body>
</html>
